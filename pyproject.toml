[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tagcor-ledger"
version = "0.1.0"
description = "Keyboard-first local ledger tool built around four-level tags."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7",
    "filelock>=3.13",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.gui-scripts]
tagcor-ledger = "tagcor_ledger.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tagcor_ledger.resources" = ["*.qss", "icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
