[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tagcor-ledger"
version = "0.24.1"
description = "Windows-first local personal ledger with SQLite and PySide6."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.13",
    "platformdirs>=4.2",
    # `zoneinfo.ZoneInfo("Asia/Taipei")` 要有 IANA 時區資料庫，而 **Windows 沒有系統
    # 層的那一份**。conda 的 Python 附了 tzdata，所以這個相依一直是隱形的 ——
    # 2026-09-01 在一個純 pip venv 上實測，29 個測試直接 collection error
    # （`ZoneInfoNotFoundError`）。
    #
    # **不加 `; sys_platform == "win32"` 標記。** 「因為作業系統剛好附了所以能跑」
    # 正是上面那個 bug 的成因；Linux 容器也可能是精簡到沒有 tzdata 的。
    # 這個套件只有約 1 MB，無條件裝比較誠實。
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# **上界是必要的，不是保守。** 這裡原本是 `ruff>=0.4` 這種開放範圍，於是 CI 裝到
# 最新版而本機是 0.15.x —— 兩邊的預設規則集不同，同一份程式碼本機綠、CI 紅
# （2026-09-01 第一次跑 CI 就踩到：新版 ruff 預設開了 I001 import 排序）。
# 一個會因為別人發新版而變紅的閘門，紅的時候不代表你改壞了什麼。
# 升級要有意識地做：把上界往上抬，然後跑一次 .\Verify.ps1 -Ui 看要修什麼。
dev = [
    "pytest>=8.0,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.15,<0.16",
    "mypy>=2.1,<3",
]

[project.gui-scripts]
# 必須指向 main_gui 而不是 main：gui-scripts 產生的 exe 沒有主控台，
# 而 main() 少了 --gui 只會印文字然後結束，使用者看到的是「什麼都沒發生」。
tagcor-ledger = "tagcor_ledger.main:main_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tagcor_ledger.resources" = ["*.qss", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = [
    "performance: opt-in large-data performance benchmark",
    # 量像素的測試。CI 跑在 Linux，字體與 Qt 平台外掛都與 Windows 不同，同一份
    # 版面量出來的數字不會一樣 —— 而這個專案是 Windows-first，在 Linux 上驗版面
    # 驗到的不是使用者會看到的東西。CI 用 `-m "not geometry"` 跳過，這幾條由
    # 本機的 `.\Verify.ps1 -Ui` 負責。
    "geometry: measures widget pixels; Windows-only, excluded from Linux CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# PySide6 沒有 py.typed，所以匯入它的模組會噴 import-untyped，繼承 Qt 類別會噴
# 「Class cannot subclass X (has type Any)」。只放寬到真的碰 Qt 的模組：
# `tagcor_ledger.ui.controller.*` 與 `tagcor_ledger.ui.formatting.*` **刻意不在清單裡**，
# 維持完整 strict —— 它們不 import Qt，放寬只會讓型別檢查白白鬆掉一大塊。
# 2026-08-22 它們從單一模組變成套件，這條仍然成立（子模組同樣不在清單上）。
#
# **2026-08-22 實測過這八筆有沒有多餘的：逐一拿掉再跑 mypy --strict，八筆全都會噴。**
# 沒有殘留。清單增減之後值得再測一次 —— 做法是把某一筆註解掉然後跑
# `python -m mypy --no-incremental src`，不噴就表示那一筆可以刪。
[[tool.mypy.overrides]]
module = [
    "tagcor_ledger.ui.app",
    "tagcor_ledger.ui.main_window",
    "tagcor_ledger.ui.error_handler",
    "tagcor_ledger.ui.instance_channel",
    "tagcor_ledger.ui.pages.*",
    "tagcor_ledger.ui.startup_dialog",
    "tagcor_ledger.ui.theme",
    "tagcor_ledger.ui.widgets.*",
]
disable_error_code = ["import-untyped"]
disallow_subclassing_any = false
