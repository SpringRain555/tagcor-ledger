[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tagcor-ledger"
version = "0.7.0"
description = "Windows-first local personal ledger with SQLite and PySide6."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.13",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.gui-scripts]
tagcor-ledger = "tagcor_ledger.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tagcor_ledger.resources" = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = [
    "performance: opt-in large-data performance benchmark",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

# PySide6 沒有 py.typed，所以匯入它的模組會噴 import-untyped，繼承 Qt 類別會噴
# 「Class cannot subclass X (has type Any)」。只放寬到真的碰 Qt 的模組：
# ui/controller.py 與 ui/formatting.py 不在清單裡，維持完整 strict。
[[tool.mypy.overrides]]
module = [
    "tagcor_ledger.ui.app",
    "tagcor_ledger.ui.main_window",
    "tagcor_ledger.ui.pages.*",
    "tagcor_ledger.ui.theme",
    "tagcor_ledger.ui.widgets.*",
]
disable_error_code = ["import-untyped"]
disallow_subclassing_any = false
