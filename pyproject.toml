[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tagcor-ledger"
version = "0.5.0"
description = "Windows-first local personal ledger with SQLite and PySide6."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "filelock>=3.13",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.gui-scripts]
tagcor-ledger = "tagcor_ledger.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tagcor_ledger.resources" = ["*.qss", "icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = [
    "performance: opt-in large-data performance benchmark",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "tagcor_ledger.ui.app",
    "tagcor_ledger.ui.main_window_phase12",
]
disable_error_code = ["import-untyped", "misc"]
