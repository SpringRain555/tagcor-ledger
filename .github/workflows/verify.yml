# 對應 Verify.ps1 的 ruff → mypy --strict → pytest 三段。
#
# **不呼叫 Verify.ps1 本身**：它是 Windows-only，而且會去讀 %LOCALAPPDATA% 的指標檔
# 做路徑漂移檢查 —— 那一項在 CI 上沒有意義（沒有真實資料路徑可以比對）。步驟在這裡
# 重列一次，兩邊要一起改。
#
# **PySide6 由 pip 安裝，這是刻意的例外。** 專案硬規則說 PySide6 不能給 pip 裝，
# 理由寫得很明白：Windows 下 conda 與 pip 混裝會讓 Qt DLL 載入失敗。這裡是 Linux
# runner 上的乾淨 venv，不存在混裝。所以只在這個 workflow 的 step 裡裝，
# **絕不加進 pyproject.toml 的 dependencies** —— 那會讓開發者的 Windows 環境踩到雷。
#
# **跑得動的都跑，只排除量像素的那 21 條**（`-m "not geometry"`）。那幾條量出來的
# 數字取決於字體與 Qt 平台外掛，而這個專案是 Windows-first —— 在 Linux 上驗版面，
# 驗到的不是使用者會看到的東西，失敗訊息還會指向錯的方向。它們由本機的
# `.\Verify.ps1 -Ui` 負責，而那是發版前一定會跑的。
#
# UI 是這個專案缺陷密度最高的地方（changelog 的 v0.14.1–v0.16.4 幾乎全是實機才
# 發現的 UI bug，那 148 條行為測試就是它們的回歸守門），所以值得進 CI。

name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # v4／v5 跑在 Node.js 20 上，而 runner 已經在警告它被淘汰並強制改用 Node 24。
      # v7 是原生 Node 24。用法沒變，這兩個是 drop-in。
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Qt 的執行期相依
        # PySide6 的 wheel 自帶 Qt，但 Qt 本身還是要這幾個系統函式庫才載得起來。
        # 少了它們的症狀是 import PySide6 直接 ImportError，訊息指向 libEGL。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: 安裝專案與開發相依
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install PySide6

      - name: ruff
        run: python -m ruff check --no-cache .

      - name: mypy --strict
        run: python -m mypy --no-incremental src

      - name: pytest（不含量像素的 geometry）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not geometry" -q
